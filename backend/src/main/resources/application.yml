server:
  port: 8090

spring:
  application:
    name: video-moderation
  datasource:
    url: jdbc:mysql://localhost:3306/video_moderation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-mysql.sql
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false

app:
  storage:
    root-path: ${user.dir}/storage
  ffmpeg:
    ffmpeg-path: ${FFMPEG_PATH:${user.dir}/tools/ffmpeg/bin/ffmpeg.exe}
    ffprobe-path: ${FFPROBE_PATH:${user.dir}/tools/ffmpeg/bin/ffprobe.exe}
  asr:
    enabled: true
    base-url: http://localhost:9000
    transcribe-path: /transcribe
  subtitle-ocr:
    enabled: true
    ocr-path: /ocr-subtitles
    interval-seconds: 0.75
    crop-bottom-ratio: 1.0       # 1.0=扫描整个画面(识别任意位置文字); 0.35=仅底部字幕条(更快但漏非底部文字)
    min-confidence: 0.35
  subtitle-removal:
    engine: vsr                 # vsr = 调用 vsr-service 做 AI inpainting 去字幕; delogo = ffmpeg 邻域插值(快)
    base-url: http://localhost:9100
    remove-path: /remove-subtitle
    inpaint-mode: sttn_auto     # sttn_auto / sttn_det / lama / propainter / opencv
    timeout-seconds: 600        # CPU 上 inpainting 较慢,单段处理超时放宽
  ai:
    enabled: false
    api-type: chat
    base-url: http://localhost:11434
    api-key:
    model: qwen2.5
    temperature: 0
    confidence-threshold: 0.6
    timeout-seconds: 60
  clip:
    padding-seconds: 0.2
    precise-export: false
