server:
  port: 8090

spring:
  application:
    name: video-moderation
  datasource:
    url: jdbc:mysql://localhost:3306/video_moderation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-mysql.sql
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false

app:
  storage:
    root-path: ${user.dir}/storage
  ffmpeg:
    ffmpeg-path: ${FFMPEG_PATH:${user.dir}/tools/ffmpeg/bin/ffmpeg.exe}
    ffprobe-path: ${FFPROBE_PATH:${user.dir}/tools/ffmpeg/bin/ffprobe.exe}
    subtitle-blur-sigma: 6.0      # delogo 去字幕后高斯柔化强度;越小越清晰(过小暴露插值痕迹),越大越糊。原 12 偏糊
    subtitle-feather-max: 40      # 字幕块边缘羽化过渡带上限(px);越大边缘越柔和自然。原 22
  asr:
    enabled: true
    base-url: http://localhost:9000
    transcribe-path: /transcribe
  subtitle-ocr:
    enabled: true
    base-url: http://localhost:9001   # OCR 独立服务,与 Whisper(9000) 拆开避免 torch/paddle 同进程 CUDA 冲突;留空则回退用 asr.base-url
    ocr-path: /ocr-subtitles
    interval-seconds: 0.75
    crop-bottom-ratio: 1.0       # 1.0=扫描整个画面(识别任意位置文字); 0.35=仅底部字幕条(更快但漏非底部文字)
    min-confidence: 0.35
  ai:
    enabled: false
    api-type: chat
    base-url: http://localhost:11434
    api-key:
    model: qwen2.5
    temperature: 0
    confidence-threshold: 0.6
    timeout-seconds: 60
  clip:
    padding-seconds: 0.2
    precise-export: false
